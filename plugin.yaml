name: hermes-ebay-ops
version: "0.1.0"
manifest_version: 2
api_version: 1
description: bae — your eBay sidekick for Hermes Agent, with listing QA, 2026 fee & shipping math, and an interactive seller desk
author: jarrett-del
license: MIT
homepage: https://github.com/jarrett-del/bae
requires_hermes: ">=0.23.0"
tags:
  - ebay
  - commerce
  - reseller
  - inventory
  - listings
python_dependencies:
  - pydantic>=2.7.0,<3.0.0
  - defusedxml>=0.7.1,<1.0.0
optional_env:
  - name: EBAY_PLUGIN_CLIENT_ID
    description: eBay Developer Application OAuth Client ID
  - name: EBAY_PLUGIN_CLIENT_SECRET
    description: eBay Developer Application OAuth Client Secret
oauth:
  - id: ebay
    authorize_url: https://auth.ebay.com/oauth2/authorize
    token_url: https://api.ebay.com/identity/v1/oauth2/token
    client_id_env: EBAY_PLUGIN_CLIENT_ID
    client_secret_env: EBAY_PLUGIN_CLIENT_SECRET
    hosts:
      - api.ebay.com
      - apiz.ebay.com
      - apim.ebay.com
    # Only what the live adapter calls: base scope (Taxonomy, Metadata, Browse comps), Inventory and
    # Media (listings, photos), Account (business policies), Fulfillment read-only (paid orders).
    # Hermes refuses a sign-in unless eBay grants every scope listed here.
    scopes:
      - https://api.ebay.com/oauth/api_scope
      - https://api.ebay.com/oauth/api_scope/sell.inventory
      - https://api.ebay.com/oauth/api_scope/sell.account
      - https://api.ebay.com/oauth/api_scope/sell.fulfillment.readonly
config_schema:
  mode:
    type: str
    default: auto
    choices:
      - auto
      - lite
      - pro
    label: Seller Ops Mode
    description: Progressive tool visibility mode (auto unlocks Pro tools once COGS or bin codes are entered)
  adapter_mode:
    type: str
    default: mock
    choices:
      - live
      - mock
    label: eBay Adapter
    description: Sample data (mock, the default) never contacts eBay. Switch to live after signing in with `hermes auth add hermes-ebay-ops:ebay`.
  mock_persona:
    type: str
    default: lite
    choices:
      - lite
      - pro
    label: Mock Seller Persona
    description: Default seller persona when adapter_mode is mock
  marketplace_id:
    type: str
    default: EBAY_US
    label: Marketplace ID
    description: Default eBay marketplace identifier (e.g. EBAY_US, EBAY_GB, EBAY_CA)
  media_base_url:
    type: str
    default: https://apiz.ebay.com
    label: Commerce Media Host
    description: Base URL for Commerce Media createImageFromFile uploads (https://apiz.ebay.com or https://apim.ebay.com)
  action_token_ttl_seconds:
    type: int
    default: 900
    label: Approval Token TTL (seconds)
    description: Expiration window in seconds for two-step write action tokens
provides_tools:
  - ebay_stage_listing
  - ebay_audit_active_listing
  - ebay_check_comps
  - ebay_confirm_action
  - ebay_export_draft_csv
  - ebay_triage_offers
  - ebay_lookup_bin
  - ebay_import_migration_csv
  - ebay_diagnose_stale
provides_hooks:
  - pre_tool_call
