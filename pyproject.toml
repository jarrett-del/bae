[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-ebay-ops"
version = "0.1.0"
description = "bae — your eBay sidekick for Hermes Agent, with listing QA, 2026 fee & shipping math, and an interactive seller desk"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "defusedxml>=0.7.1,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools]
packages = [
    "hermes_ebay_ops",
    "hermes_ebay_ops.adapter",
    "hermes_ebay_ops.tools",
    "hermes_ebay_ops.scripts",
]

[tool.setuptools.package-dir]
hermes_ebay_ops = "."
"hermes_ebay_ops.adapter" = "adapter"
"hermes_ebay_ops.tools" = "tools"
"hermes_ebay_ops.scripts" = "scripts"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["."]
